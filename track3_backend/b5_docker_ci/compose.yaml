# Local production-like run: the API + Postgres.  docker compose up --build
services:
  api:
    build:
      context: ../..                     # lab root, so the image can include common/ and track3_backend/
      dockerfile: track3_backend/b5_docker_ci/Dockerfile
    ports: ["8000:8000"]
    environment:
      # TODO: DATABASE_URL pointing to the db service, LLM_PROVIDER=fake
      LLM_PROVIDER: fake
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_local_only   # local dev only; real secrets never go in files
      POSTGRES_DB: tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d tracker"]
      interval: 5s
      retries: 10
